<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Library</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf5ee;--card:#fffdf9;--ink:#2b2320;--mute:#8a7d72;--line:#e9dfd2;--accent:#b4553a;--accent2:#d99a5b;--shadow:0 10px 30px rgba(80,50,30,.12);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16120f;--card:#211b17;--ink:#f3e9dd;--mute:#a1917f;--line:#33291f;--accent:#e08a66;--accent2:#e6b46f;--shadow:0 10px 30px rgba(0,0,0,.45)}}
:root[data-theme="dark"]{--bg:#16120f;--card:#211b17;--ink:#f3e9dd;--mute:#a1917f;--line:#33291f;--accent:#e08a66;--accent2:#e6b46f;--shadow:0 10px 30px rgba(0,0,0,.45)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:28px 20px 90px}
h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:clamp(2rem,6vw,3.2rem);margin:0;letter-spacing:-.02em}
h1 em{color:var(--accent);font-weight:400}
.sub{color:var(--mute);margin:6px 0 22px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 16px;min-width:92px}
.stat b{font-family:Fraunces,Georgia,serif;font-size:1.5rem;display:block}.stat span{font-size:.75rem;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);padding:4px;border-radius:999px;overflow-x:auto;max-width:100%}
.tab{border:0;background:none;color:var(--mute);padding:8px 16px;border-radius:999px;cursor:pointer;font:500 .9rem Inter,sans-serif;white-space:nowrap}
.tab.on{background:var(--accent);color:#fff}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent2);outline-offset:1px}
.search{flex:1;min-width:150px;max-width:280px}
.btn{border:0;background:var(--accent);color:#fff;padding:11px 20px;border-radius:999px;font:600 .95rem Inter,sans-serif;cursor:pointer;box-shadow:var(--shadow)}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line);box-shadow:none}.btn.del{background:none;color:#c0392b;box-shadow:none;border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:20px}
.card{cursor:pointer;transition:transform .2s}.card:hover{transform:translateY(-4px)}
.cover{aspect-ratio:2/3;border-radius:14px;overflow:hidden;box-shadow:var(--shadow);position:relative;background:linear-gradient(145deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover .ph{font-family:Fraunces,Georgia,serif;color:#fff;font-size:3.4rem;opacity:.9}
.badge{position:absolute;top:8px;left:8px;background:rgba(20,14,10,.65);color:#fff;font-size:.68rem;padding:3px 9px;border-radius:999px;backdrop-filter:blur(4px)}
.st{position:absolute;bottom:8px;right:8px;width:10px;height:10px;border-radius:50%;border:2px solid #fff}
.t{font-family:Fraunces,Georgia,serif;font-weight:600;margin:10px 2px 2px;font-size:1rem;line-height:1.25}
.m{color:var(--mute);font-size:.8rem;margin:0 2px}.stars{color:var(--accent2);font-size:.85rem;margin:2px}
.empty{text-align:center;color:var(--mute);padding:70px 10px;font-family:Fraunces,Georgia,serif;font-style:italic;font-size:1.2rem}
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;font-size:1.8rem;padding:0}
.modal{position:fixed;inset:0;background:rgba(15,10,6,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:20;backdrop-filter:blur(3px)}
.modal.open{display:flex}
.sheet{background:var(--bg);border-radius:22px;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:22px;box-shadow:var(--shadow)}
.sheet h2{font-family:Fraunces,Georgia,serif;margin:0 0 14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
label{font-size:.75rem;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;display:block;margin:0 0 4px}
.up{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.thumb{width:84px;aspect-ratio:2/3;border-radius:10px;background:var(--card);border:1px dashed var(--line);overflow:hidden;flex:none}.thumb img{width:100%;height:100%;object-fit:cover}
.rate{font-size:1.6rem;color:var(--line);cursor:pointer;user-select:none}.rate span.on{color:var(--accent2)}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.note{font-size:.75rem;color:var(--mute);text-align:center;margin-top:30px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><h1>My <em>Library</em></h1><p class="sub">Movies, series &amp; books I’ve loved, am loving, or can’t wait for.</p></div>
  <button class="btn" id="addTop">+ Add new</button></div>
  <div class="stats" id="stats"></div>
  <div class="bar">
    <div class="tabs" id="tabs"></div>
    <input class="search" id="q" placeholder="Search title or author…">
    <select id="sf" style="width:auto"><option value="">All status</option><option value="done">Finished</option><option value="doing">In progress</option><option value="want">Want to</option></select>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>Nothing here yet — add your first title ✨</div>
  <div class="note" id="note"></div>
</div>
<button class="btn fab" id="fab" aria-label="Add">+</button>

<div class="modal" id="modal"><div class="sheet">
  <h2 id="mt">Add new</h2>
  <div class="up"><div class="thumb" id="thumb"></div><div style="flex:1"><label>Cover picture</label><a id="find" class="btn ghost" target="_blank" rel="noopener" href="#" style="display:inline-block;text-decoration:none;padding:8px 14px;font-size:.85rem">🔍 Find cover online</a><div style="font-size:.75rem;color:var(--mute);margin:8px 0 6px">Copy any image (right-click → Copy image), then come back and press Ctrl+V here. Or choose a file:</div><input type="file" id="file" accept="image/*"></div></div>
  <div class="row"><div><label>Type</label><select id="type"><option value="movie">Movie</option><option value="series">Series</option><option value="book">Book</option></select></div>
  <div><label>Status</label><select id="status"><option value="want">Want to</option><option value="doing">In progress</option><option value="done">Finished</option></select></div></div>
  <div style="margin-bottom:10px"><label>Title</label><input id="title" placeholder="e.g. Dune"></div>
  <div class="row"><div><label id="byl">Director / Author</label><input id="by"></div><div><label>Year</label><input id="year" inputmode="numeric" maxlength="4"></div></div>
  <div style="margin-bottom:10px"><label>My rating</label><div class="rate" id="rate"></div></div>
  <div><label>Notes</label><textarea id="notes" rows="3" placeholder="Thoughts, favourite scene, where I stopped…"></textarea></div>
  <div class="acts"><button class="btn del" id="del" hidden>Delete</button><button class="btn ghost" id="cancel">Cancel</button><button class="btn" id="save">Save</button></div>
</div></div>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var TYPES=[["all","All"],["movie","Movies"],["series","Series"],["book","Books"]];
var LABEL={movie:"Movie",series:"Series",book:"Book"},COL={want:"#8aa4c8",doing:"#e6b46f",done:"#6fbf8a"};
var items=[],tab="all",cur=null,rating=0,cover="",store=null;

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

/* ---------- storage: private db if available, else this browser ---------- */
function localStore(){
  var K="my-library-v1";
  function load(){try{return JSON.parse(localStorage.getItem(K)||"[]")}catch(e){return[]}}
  function put(a){try{localStorage.setItem(K,JSON.stringify(a))}catch(e){alert("Could not save — storage is full or blocked.")}}
  return{name:"local",init:function(cb){items=load();cb()},
    save:function(it){var a=load().filter(function(x){return x.id!==it.id});a.push(it);put(a);items=a;render()},
    remove:function(id){var a=load().filter(function(x){return x.id!==id});put(a);items=a;render()}};
}
function dbStore(db,uid){
  var col=db.collection("data/users/"+uid);
  return{name:"db",init:function(cb){
    var done=false,t=setTimeout(function(){if(!done){done=true;store=localStore();store.init(render)}},10000);
    col.onSnapshot(function(s){
      items=s.docs.map(function(d){var x=d.data()||{};x.id=d.id;return x});
      if(!done){done=true;clearTimeout(t)}render();
    },function(){if(!done){done=true;clearTimeout(t);store=localStore();store.init(render)}});
  },
  save:function(it){var id=it.id,o=Object.assign({},it);delete o.id;return col.doc(id).set(o).catch(function(){alert("Could not save. Please try again.")})},
  remove:function(id){return col.doc(id).delete()}};
}
async function boot(){
  store=localStore();
  try{
    var c=window.claude&&await window.claude.use("db");
    var u=window.claude&&await window.claude.use("user");
    var uid=c&&u?await u.id():null;
    if(c&&uid)store=dbStore(c,uid);
  }catch(e){}
  $("note").textContent=store.name==="db"?"Saved privately to your account — add or edit anytime.":"Saved in this browser only.";
  store.init(render);
}

/* ---------- render ---------- */
function stars(n){var s="";for(var i=1;i<=5;i++)s+=i<=n?"★":"☆";return s}
function render(){
  $("tabs").innerHTML=TYPES.map(function(t){return '<button class="tab'+(tab===t[0]?" on":"")+'" data-t="'+t[0]+'">'+t[1]+'</button>'}).join("");
  var c=function(t){return items.filter(function(x){return x.type===t}).length};
  var fin=items.filter(function(x){return x.status==="done"}).length;
  $("stats").innerHTML=[["Movies",c("movie")],["Series",c("series")],["Books",c("book")],["Finished",fin]].map(function(s){return '<div class="stat"><b>'+s[1]+'</b><span>'+s[0]+'</span></div>'}).join("");
  var q=$("q").value.trim().toLowerCase(),sf=$("sf").value;
  var list=items.filter(function(x){
    return (tab==="all"||x.type===tab)&&(!sf||x.status===sf)&&(!q||((x.title||"")+" "+(x.by||"")).toLowerCase().indexOf(q)>-1);
  }).sort(function(a,b){return (b.added||0)-(a.added||0)});
  $("empty").hidden=list.length>0;
  $("grid").innerHTML=list.map(function(x){
    var img=x.cover?'<img src="'+esc(x.cover)+'" alt="">':'<div class="ph">'+esc((x.title||"?").charAt(0).toUpperCase())+'</div>';
    return '<div class="card" data-id="'+esc(x.id)+'"><div class="cover">'+img+'<span class="badge">'+LABEL[x.type]+'</span><span class="st" style="background:'+COL[x.status]+'"></span></div>'
      +'<div class="t">'+esc(x.title)+'</div><div class="m">'+esc([x.by,x.year].filter(Boolean).join(" · "))+'</div>'+(x.rating?'<div class="stars">'+stars(x.rating)+'</div>':"")+'</div>';
  }).join("");
}

/* ---------- modal ---------- */
function setRate(n){rating=n;$("rate").innerHTML=[1,2,3,4,5].map(function(i){return '<span data-r="'+i+'" class="'+(i<=n?"on":"")+'">★</span>'}).join("")}
function setThumb(){$("thumb").innerHTML=cover?'<img src="'+esc(cover)+'" alt="">':""}
function byLabel(){$("byl").textContent=$("type").value==="book"?"Author":$("type").value==="movie"?"Director":"Creator / Network"}
function openM(it){
  cur=it||null;$("mt").textContent=it?"Edit":"Add new";$("del").hidden=!it;
  $("type").value=it?it.type:(tab==="all"?"movie":tab);$("status").value=it?it.status:"want";
  $("title").value=it?it.title:"";$("by").value=it?it.by||"":"";$("year").value=it?it.year||"":"";$("notes").value=it?it.notes||"":"";
  cover=it?it.cover||"":"";$("file").value="";setThumb();setRate(it?it.rating||0:0);byLabel();
  $("modal").classList.add("open");setTimeout(function(){$("title").focus()},50);
}
function closeM(){$("modal").classList.remove("open")}
function resize(file){
  return new Promise(function(res){
    var r=new FileReader();
    r.onload=function(){var im=new Image();im.onload=function(){
      var w=360,h=Math.round(im.height*w/im.width);if(im.width<w){w=im.width;h=im.height}
      var cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").drawImage(im,0,0,w,h);
      res(cv.toDataURL("image/jpeg",.78))};im.onerror=function(){res("")};im.src=r.result};
    r.onerror=function(){res("")};r.readAsDataURL(file);
  });
}

$("tabs").onclick=function(e){var t=e.target.getAttribute("data-t");if(t){tab=t;render()}};
$("q").oninput=render;$("sf").onchange=render;
$("addTop").onclick=$("fab").onclick=function(){openM(null)};
$("grid").onclick=function(e){var c=e.target.closest(".card");if(!c)return;var id=c.getAttribute("data-id");openM(items.filter(function(x){return x.id===id})[0])};
$("type").onchange=byLabel;
$("rate").onclick=function(e){var r=e.target.getAttribute("data-r");if(r)setRate(+r===rating?0:+r)};
async function useFile(f){if(f&&f.type.indexOf("image")===0){cover=await resize(f);setThumb()}}
$("file").onchange=function(){useFile(this.files[0])};
document.addEventListener("paste",function(e){if(!$("modal").classList.contains("open"))return;var its=(e.clipboardData&&e.clipboardData.items)||[];for(var i=0;i<its.length;i++){if(its[i].type.indexOf("image")===0){useFile(its[i].getAsFile());e.preventDefault();return}}});
$("thumb").ondragover=function(e){e.preventDefault()};
$("thumb").ondrop=function(e){e.preventDefault();useFile(e.dataTransfer.files[0])};
$("find").onclick=function(e){var t=$("title").value.trim();if(!t){e.preventDefault();$("title").focus();return}this.href="https://www.google.com/search?tbm=isch&q="+encodeURIComponent(t+" "+($("type").value==="book"?"book cover":$("type").value+" poster"))};
$("cancel").onclick=closeM;
$("modal").onclick=function(e){if(e.target===$("modal"))closeM()};
$("save").onclick=function(){
  var title=$("title").value.trim();if(!title){$("title").focus();return}
  var it={id:cur?cur.id:"i"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),type:$("type").value,status:$("status").value,title:title,by:$("by").value.trim(),year:$("year").value.trim(),rating:rating,notes:$("notes").value.trim(),cover:cover,added:cur?cur.added:Date.now()};
  closeM();store.save(it);
};
$("del").onclick=function(){if(cur&&confirm("Delete “"+cur.title+"”?")){closeM();store.remove(cur.id)}};
render();boot();
})();
</script>
</body>
</html>
